name: Triage new issues

# The fleet's priority rule ("no new work while a HIGH is unowned") is evaluated as
# `gh issue list --milestone <current>`. An issue filed without a milestone is therefore
# invisible to that check no matter how severe it is — which has already hidden the
# project's worst open findings. This stamps the current milestone on arrival so the
# rule is self-maintaining, and flags anything still missing a severity label.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CURRENT_MILESTONE: ${{ vars.CURRENT_MILESTONE }}
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            // Resolving "current milestone" must never GUESS. A silently mis-filed issue is
            // the same failure this workflow exists to prevent: a machine-evaluated rule
            // returning a confidently wrong set. So every ambiguous case fails loudly instead.
            //   repo variable CURRENT_MILESTONE set + open   -> use it
            //   set but not an open milestone (stale)        -> fail the run
            //   unset, exactly one open milestone            -> use it (unambiguous)
            //   unset, several open milestones               -> fail the run, asking for the variable
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'open', per_page: 100,
            });
            const declared = (process.env.CURRENT_MILESTONE || '').trim();

            if (issue.milestone) {
              core.info(`#${issue.number} already milestoned (${issue.milestone.title}); left alone.`);
            } else if (milestones.length === 0) {
              core.info('No open milestone exists; nothing to stamp.');
            } else {
              let current;
              if (declared) {
                current = milestones.find(m => m.title === declared);
                if (!current) {
                  core.setFailed(
                    `CURRENT_MILESTONE is "${declared}" but no OPEN milestone has that title ` +
                    `(open: ${milestones.map(m => m.title).join(', ')}). ` +
                    `Update the repo variable — #${issue.number} was left unmilestoned rather than mis-filed.`
                  );
                  return;
                }
              } else if (milestones.length === 1) {
                current = milestones[0];
              } else {
                core.setFailed(
                  `Several milestones are open (${milestones.map(m => m.title).join(', ')}) and ` +
                  `CURRENT_MILESTONE is unset, so "current" is ambiguous. Set the repo variable. ` +
                  `#${issue.number} was left unmilestoned rather than guessed into the wrong one.`
                );
                return;
              }
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, milestone: current.number,
              });
              core.notice(`#${issue.number} → milestone "${current.title}".`);
            }

            // Severity cannot be inferred, so this never guesses one — it marks the gap
            // instead, which keeps an untriaged issue visible rather than silently plausible.
            const SEVERITY = ['bug', 'security', 'enhancement', 'documentation', 'question'];
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            if (!labels.some(l => SEVERITY.includes(l))) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['needs-triage'],
              });
              core.notice(`#${issue.number} has no severity label → needs-triage.`);
            }
